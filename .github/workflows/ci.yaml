name: Charts CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'

env:
  HELM_VERSION: v3.22.0
  OCI_REPOSITORY: charts
  README_GENERATOR_VERSION: 2.7.2
  KUBECONFORM_VERSION: v0.8.0

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -sfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Helm lint
        run: make lint

      # Regenerates each chart's parameter table from the @param annotations in
      # values.yaml and fails if the committed README differs. Also fails when
      # an annotation names a value that does not exist, or a value has none.
      - name: Check README parameter tables are in sync
        run: make readme-check

      - name: Check values schemas are in sync
        run: make schema-check

      # Every template in charts/*/templates is an unrendered partial, so lint
      # alone proves nothing. This packages the local chart, renders each
      # example against it at every supported Kubernetes version, and validates
      # the result against the real API schemas.
      - name: Render examples and validate manifests
        run: make conform

  publish:
    name: Publish
    needs: check
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Publishes every chart under charts/ whose version is not in the registry
      # yet, so re-runs and pushes that do not bump a chart version are no-ops.
      - name: Publish charts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${OCI_REPOSITORY}"
          for chart in charts/*/; do
            name="$(yq '.name' "${chart}Chart.yaml")"
            version="$(yq '.version' "${chart}Chart.yaml")"

            if helm show chart "oci://${registry}/${name}" --version "$version" >/dev/null 2>&1; then
              echo "::notice::${name} ${version} is already published, skipping"
              continue
            fi

            helm dependency build "$chart"
            helm package "$chart" --destination dist

            helm push "dist/${name}-${version}.tgz" "oci://${registry}"
            # The schema ships as its own asset so consumers can drop it into
            # their application chart, where Helm will actually enforce it.
            cp "${chart}values.schema.json" "dist/${name}-${version}-values.schema.json"
            gh release create "${name}-${version}" \
              "dist/${name}-${version}.tgz" \
              "dist/${name}-${version}-values.schema.json" \
              --title "${name} ${version}" \
              --generate-notes
          done
