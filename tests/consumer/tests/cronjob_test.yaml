suite: cronjob
templates:
  - app.yaml
release:
  name: my-app
  namespace: apps
set:
  cronjob.enabled: true
  cronjob.schedule: "*/5 * * * *"
  cronjob.containers:
    - name: job
      image: alpine:3.22
tests:
  - it: runs the containers on the schedule
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - isAPIVersion:
          of: batch/v1
      - equal:
          path: metadata.name
          value: my-app-consumer
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers
          value:
            - name: job
              image: alpine:3.22
      - equal:
          path: spec.jobTemplate.spec.template.spec.restartPolicy
          value: OnFailure
      - equal:
          path: spec.successfulJobsHistoryLimit
          value: 3
      - equal:
          path: spec.schedule
          value: "*/5 * * * *"
      - equal:
          path: spec.concurrencyPolicy
          value: Allow

  - it: adds pod annotations, init containers and volumes
    set:
      cronjob.podAnnotations:
        owner: batch
      cronjob.initContainers:
        - name: prepare
          image: alpine:3.22
      cronjob.volumes:
        - name: scratch
          emptyDir: {}
      cronjob.successfulJobsHistoryLimit: 1
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.metadata.annotations.owner
          value: batch
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].name
          value: prepare
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[0].name
          value: scratch
      - equal:
          path: spec.successfulJobsHistoryLimit
          value: 1

  - it: honours cronjob.restartPolicy
    set:
      cronjob.restartPolicy: Never
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.restartPolicy
          value: Never

  - it: uses its own security context, not the workload's
    set:
      podSecurityContext.enabled: true
      podSecurityContext.fsGroup: 2000
      cronjob.podSecurityContext.enabled: true
      cronjob.podSecurityContext.fsGroup: 9999
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.fsGroup
          value: 9999

  - it: omits the security context when only the workload enables one
    set:
      podSecurityContext.enabled: true
      podSecurityContext.fsGroup: 2000
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - notExists:
          path: spec.jobTemplate.spec.template.spec.securityContext

  - it: inherits the top-level nodeSelector when it sets none of its own
    set:
      nodeSelector:
        tier: general
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.nodeSelector.tier
          value: general

  - it: prefers its own nodeSelector over the top-level one
    set:
      nodeSelector:
        tier: general
      cronjob.nodeSelector:
        tier: batch
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.nodeSelector.tier
          value: batch

  - it: prefers its own tolerations over the top-level ones
    set:
      tolerations:
        - key: general
          operator: Exists
      cronjob.tolerations:
        - key: batch
          operator: Exists
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.tolerations[0].key
          value: batch

  - it: is absent unless enabled
    set:
      cronjob.enabled: false
    documentSelector:
      path: kind
      value: CronJob
      skipEmptyTemplates: true
    asserts:
      - hasDocuments:
          count: 0
