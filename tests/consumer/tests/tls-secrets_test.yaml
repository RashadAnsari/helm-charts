suite: tls secrets
templates:
  - app.yaml
release:
  name: my-app
  namespace: apps
set:
  ingress.enabled: true
  ingress.secrets:
    - name: shop-tls
      certificate: CERT
      key: KEY
    - name: admin-tls
      certificate: CERT2
      key: KEY2
tests:
  - it: renders one Secret per entry in ingress.secrets
    documentSelector:
      path: metadata.name
      value: shop-tls
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: type
          value: kubernetes.io/tls
      - equal:
          path: data["tls.crt"]
          value: Q0VSVA==
      - equal:
          path: data["tls.key"]
          value: S0VZ
  - it: including the second entry
    documentSelector:
      path: metadata.name
      value: admin-tls
    asserts:
      - isKind:
          of: Secret

  - it: is absent when the Ingress is disabled
    set:
      ingress.enabled: false
    documentSelector:
      path: kind
      value: Secret
      skipEmptyTemplates: true
    asserts:
      - hasDocuments:
          count: 0
