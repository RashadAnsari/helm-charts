suite: serviceaccount
templates:
  - app.yaml
release:
  name: my-app
  namespace: apps
set:
  serviceAccount.create: true
tests:
  - it: is named after the release by default
    documentSelector:
      path: kind
      value: ServiceAccount
    asserts:
      - isAPIVersion:
          of: v1
      - equal:
          path: metadata.name
          value: my-app-consumer
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: honours name, token mounting, labels and annotations
    set:
      serviceAccount.name: shop
      serviceAccount.automountServiceAccountToken: false
      serviceAccount.labels:
        team: shop
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123:role/shop
    documentSelector:
      path: kind
      value: ServiceAccount
    asserts:
      - equal:
          path: metadata.name
          value: shop
      - equal:
          path: automountServiceAccountToken
          value: false
      - equal:
          path: metadata.labels.team
          value: shop
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123:role/shop

  - it: is absent unless created
    set:
      serviceAccount.create: false
    documentSelector:
      path: kind
      value: ServiceAccount
      skipEmptyTemplates: true
    asserts:
      - hasDocuments:
          count: 0
