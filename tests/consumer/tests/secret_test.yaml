suite: secret
templates:
  - app.yaml
release:
  name: my-app
  namespace: apps
tests:
  - it: renders secret.data
    set:
      secret.data:
        username: YWRtaW4=
    documentSelector:
      path: kind
      value: Secret
    asserts:
      - isAPIVersion:
          of: v1
      - equal:
          path: metadata.name
          value: my-app-consumer
      - equal:
          path: type
          value: Opaque
      - equal:
          path: data.username
          value: YWRtaW4=
      - notExists:
          path: stringData

  - it: renders secret.stringData
    set:
      secret.stringData:
        password: hunter2
    documentSelector:
      path: kind
      value: Secret
    asserts:
      - equal:
          path: stringData.password
          value: hunter2
      - notExists:
          path: data

  - it: honours type, labels and annotations
    set:
      secret.stringData:
        password: hunter2
      secret.type: kubernetes.io/basic-auth
      secret.labels:
        team: shop
      secret.annotations:
        owner: alice
    documentSelector:
      path: kind
      value: Secret
    asserts:
      - equal:
          path: type
          value: kubernetes.io/basic-auth
      - equal:
          path: metadata.labels.team
          value: shop
      - equal:
          path: metadata.annotations.owner
          value: alice

  - it: is absent without data or stringData
    documentSelector:
      path: kind
      value: Secret
      skipEmptyTemplates: true
    asserts:
      - hasDocuments:
          count: 0
