suite: ingress
templates:
  - app.yaml
release:
  name: my-app
  namespace: apps
set:
  ingress.enabled: true
  ingress.hostname: shop.example.com
tests:
  - it: emits the host and path
    documentSelector:
      path: kind
      value: Ingress
    asserts:
      - equal:
          path: spec.rules[0].host
          value: shop.example.com
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: ImplementationSpecific

  - it: honours a custom pathType
    set:
      ingress.pathType: Prefix
    documentSelector:
      path: kind
      value: Ingress
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Prefix

  - it: sets ingressClassName when given one
    set:
      ingress.ingressClassName: nginx
    documentSelector:
      path: kind
      value: Ingress
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx

  - it: omits ingressClassName when not given one
    documentSelector:
      path: kind
      value: Ingress
    asserts:
      - notExists:
          path: spec.ingressClassName

  - it: covers extra hosts, each with its own pathType
    set:
      ingress.extraHosts:
        - name: admin.example.com
          path: /admin
          pathType: Prefix
    documentSelector:
      path: kind
      value: Ingress
    asserts:
      - equal:
          path: spec.rules[1].host
          value: admin.example.com
      - equal:
          path: spec.rules[1].http.paths[0].path
          value: /admin
      - equal:
          path: spec.rules[1].http.paths[0].pathType
          value: Prefix

  - it: defaults an extra host's path and pathType
    set:
      ingress.extraHosts:
        - name: admin.example.com
    documentSelector:
      path: kind
      value: Ingress
    asserts:
      - equal:
          path: spec.rules[1].http.paths[0].path
          value: /
      - equal:
          path: spec.rules[1].http.paths[0].pathType
          value: ImplementationSpecific

  - it: points every rule at the Service's http port
    documentSelector:
      path: kind
      value: Ingress
    asserts:
      - isAPIVersion:
          of: networking.k8s.io/v1
      - equal:
          path: spec.rules[0].http.paths[0].backend.service
          value:
            name: my-app-consumer
            port:
              name: http

  - it: adds extra paths, rules and annotations
    set:
      ingress.extraPaths:
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: api
              port:
                number: 80
      ingress.extraRules:
        - host: other.example.com
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: other
                    port:
                      number: 80
      ingress.annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /
    documentSelector:
      path: kind
      value: Ingress
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /api
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /
      - equal:
          path: spec.rules[1].host
          value: other.example.com
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/rewrite-target"]
          value: /

  - it: terminates TLS with the self-signed certificate
    set:
      ingress.tls: true
      ingress.selfSigned: true
    documentSelector:
      path: kind
      value: Ingress
    asserts:
      - equal:
          path: spec.tls
          value:
            - hosts:
                - shop.example.com
              secretName: shop.example.com-tls

  - it: terminates TLS with an existing Secret
    set:
      ingress.tls: true
      ingress.existingSecret: my-cert
    documentSelector:
      path: kind
      value: Ingress
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: my-cert

  - it: terminates TLS with a cert-manager certificate
    set:
      ingress.tls: true
      ingress.annotations:
        cert-manager.io/cluster-issuer: letsencrypt
    documentSelector:
      path: kind
      value: Ingress
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: shop.example.com-tls

  - it: appends extraTls
    set:
      ingress.extraTls:
        - hosts: [admin.example.com]
          secretName: admin-tls
    documentSelector:
      path: kind
      value: Ingress
    asserts:
      - equal:
          path: spec.tls
          value:
            - hosts: [admin.example.com]
              secretName: admin-tls

  - it: has no tls section without a certificate source
    set:
      ingress.tls: true
    documentSelector:
      path: kind
      value: Ingress
    asserts:
      - notExists:
          path: spec.tls

  - it: is absent unless enabled
    set:
      ingress.enabled: false
    documentSelector:
      path: kind
      value: Ingress
      skipEmptyTemplates: true
    asserts:
      - hasDocuments:
          count: 0
